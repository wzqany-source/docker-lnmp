version: '3.8'  # Docker Compose文件格式版本

services:
  # MySQL 8.0 数据库服务
  mysql:
    image: mysql:8.0
    container_name: lnmp-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}  # root用户密码
    volumes:
      - mysql_data:/var/lib/mysql  # 数据库文件持久化
      - ./logs/mysql:/var/log/mysql   
    networks:
         - lnmp-net  # 加入自定义网络
    restart: unless-stopped  # 宿主机重启后自动恢复
    healthcheck:
      test: mysqladmin ping -h localhost -u root -p${MYSQL_ROOT_PASSWORD} || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Apache + PHP 8.1 应用服务（项目二架构）
  apache:
    image: php:8.1-apache
    container_name: lnmp-apache
    volumes:
      - ./html:/var/www/html  # 与Nginx共享网站文件
    networks:
      - lnmp-net
    depends_on:
      - mysql  # 确保MySQL先启动
    restart: unless-stopped

  # Nginx 反向代理层（项目二还原）
  nginx:
    image: nginx:alpine
    container_name: lnmp-nginx
    ports:
      - "8080:80"  # 宿主机8080映射到容器80
    volumes:
      - ./html:/var/www/html  # 网站文件
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf  # 反向代理配置
      - ./logs/nginx:/var/log/nginx
    networks:
      - lnmp-net
    depends_on:
      - apache  # 确保Apache先启动
    restart: unless-stopped
    healthcheck:
      test: curl -f http://localhost/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
# 命名卷：MySQL数据持久化
volumes:
  mysql_data:

# 自定义bridge网络：容器间通过服务名通信
networks:
  lnmp-net:
    driver: bridge
